<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMCE - Monitoreo</title>
    <link rel="shortcut icon" href="img/simce.jpg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="overlay"></div>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="img/simce.jpg" alt="SIMCE" class="sidebar-logo">
                <div><h2>SIMCE</h2><span>EvoBike — IT Celaya</span></div>
            </div>
            <ul class="sidebar-nav">
                <li><a href="index.html" data-page="dashboard"><i class="fas fa-th-large"></i> Dashboard</a></li>
                <li><a href="reservar.html" data-page="reservar"><i class="fas fa-calendar-check"></i> Reservar</a></li>
                <li><a href="historial.html" data-page="historial"><i class="fas fa-history"></i> Historial</a></li>
                <li><a href="monitoreo.html" data-page="monitoreo"><i class="fas fa-chart-line"></i> Monitoreo</a></li>
            </ul>
            <div class="sidebar-user">
                <div class="avatar">U</div>
                <div class="user-info"><strong>Usuario</strong><small>En línea</small></div>
                <button class="logout-btn" title="Cerrar sesión"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </aside>

        <div class="main">
            <header class="topbar">
                <button class="menu-toggle"><i class="fas fa-bars"></i></button>
                <h1>Monitoreo en Tiempo Real</h1>
                <div class="topbar-right"><span class="date-display"></span></div>
            </header>
            <div class="content">
                <div class="alert alert-info" id="tsStatus">
                    <i class="fas fa-satellite-dish"></i>
                    Conectando con Grafana (red local)...
                </div>
                <div class="alert alert-info" id="clockStatus">
                    <i class="fas fa-clock"></i>
                    Sincronizando reloj con el servidor...
                </div>

                <!-- Station Tabs -->
                <div class="tabs">
                    <button class="tab active" data-tab="1"><i class="fas fa-plug"></i> Estación 1</button>
                    <button class="tab" data-tab="2"><i class="fas fa-plug"></i> Estación 2</button>
                    <button class="tab" data-tab="3"><i class="fas fa-plug"></i> Estación 3</button>
                </div>

                <div class="tab-content active" id="tab-1"></div>
                <div class="tab-content" id="tab-2"></div>
                <div class="tab-content" id="tab-3"></div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js?v=9"></script>
    <script>
    // grafanaPanel: id del panel en el dashboard de Grafana (null = no existe allí)
    // field: campo del canal de ThingSpeak (respaldo)
    var chartsDef = [
        { key: 'voltaje',    field: 1, grafanaPanel: null, color: 'ef4444', title: 'Voltaje (V_RMS)', label: 'Voltaje', yaxis: 'Volts' },
        { key: 'corriente',  field: 2, grafanaPanel: 1,    color: '3b82f6', title: 'Corriente (I_RMS)', label: 'Corriente', yaxis: 'Amperes' },
        { key: 'potencia',   field: 3, grafanaPanel: 2,    color: '22c55e', title: 'Potencia', label: 'Potencia', yaxis: 'Watts' },
        { key: 'energia',    field: 4, grafanaPanel: 3,    color: 'f59e0b', title: 'Energía', label: 'Energía', yaxis: 'kWh' },
        { key: 'frecuencia', field: 5, grafanaPanel: null, color: '8b5cf6', title: 'Frecuencia', label: 'Frecuencia', yaxis: 'Hz' },
        { key: 'fp',         field: 6, grafanaPanel: 4,    color: '06b6d4', title: 'Factor de Potencia', label: 'Factor P.', yaxis: 'PF' }
    ];

    var SOURCE_LABEL = { grafana: 'Grafana', thingspeak: 'ThingSpeak' };
    var chartSource  = {};   // estación -> fuente con la que se dibujaron las gráficas
    var lastSource   = {};   // estación -> fuente de la última lectura

    function pzemItem(value, unit, label) {
        return '<div class="pzem-item"><div class="pzem-value">' + value + ' <span class="pzem-unit">' + unit + '</span></div><div class="pzem-label">' + label + '</div></div>';
    }

    function fmt(x, digits) {
        return x === null || x === undefined ? '—' : x.toFixed(digits);
    }

    function pzemDefaults() {
        return pzemItem('0', 'V', 'Voltaje') + pzemItem('0', 'A', 'Corriente') +
            pzemItem('0', 'W', 'Potencia') + pzemItem('0', 'kWh', 'Energía') +
            pzemItem('0', 'Hz', 'Frecuencia') + pzemItem('0', '', 'Factor P.');
    }

    function buildStationTab(stationId) {
        return '<div class="monitor-card" style="margin-bottom:24px;">' +
            '<div class="monitor-header">' +
            '<h3><i class="fas fa-plug" style="margin-right:8px;"></i> Estación ' + stationId + '</h3>' +
            '<span class="badge badge-offline" id="live' + stationId + '">Consultando...</span></div>' +
            '<div class="monitor-body">' +
            '<div class="pzem-grid" id="liveData' + stationId + '">' + pzemDefaults() + '</div>' +
            '<div id="lastUpdate' + stationId + '" style="margin-top:12px;font-size:12px;color:var(--text-muted);text-align:right;"></div>' +
            '<div id="tsCheck' + stationId + '" style="margin-top:4px;font-size:12px;text-align:right;"></div>' +
            '</div></div>' +
            '<h3 class="section-title"><i class="fas fa-chart-area"></i> Gráficas — Estación ' + stationId +
            ' <span class="badge badge-reserved" id="chartSrc' + stationId + '" style="margin-left:8px;">—</span></h3>' +
            '<div class="monitor-grid" id="charts' + stationId + '"></div>';
    }

    // Dibuja las gráficas solo cuando cambia la fuente, para no recargar los iframes en cada consulta
    function renderCharts(stationId, source) {
        if (chartSource[stationId] === source) return;
        chartSource[stationId] = source;
        var defs = source === 'grafana'
            ? chartsDef.filter(function(c) { return c.grafanaPanel !== null; })
            : chartsDef;
        document.getElementById('chartSrc' + stationId).textContent = SOURCE_LABEL[source];
        document.getElementById('charts' + stationId).innerHTML = defs.map(function(c) {
            var src = source === 'grafana'
                ? App.grafanaChartUrl(stationId, c.grafanaPanel)
                : App.tsChartUrl(stationId, c.field, c.color, c.label, c.yaxis);
            return '<div class="monitor-card">' +
                '<div class="monitor-header"><h3>' + c.title + '</h3><span class="badge badge-charging">En vivo</span></div>' +
                '<div class="monitor-body"><iframe src="' + src + '"></iframe></div></div>';
        }).join('');
    }

    function renderSourceStatus() {
        var el = document.getElementById('tsStatus');
        var sources = Object.keys(lastSource).map(function(k) { return lastSource[k]; });
        if (!sources.length) return;
        var hora = new Date().toLocaleTimeString('es-MX');
        if (sources.every(function(s) { return s === 'grafana'; })) {
            el.className = 'alert alert-success';
            el.innerHTML = '<i class="fas fa-check-circle"></i> Fuente: Grafana + InfluxDB en la Raspberry Pi (red local) · Última actualización: ' + hora;
        } else {
            el.className = 'alert alert-warning';
            el.innerHTML = '<i class="fas fa-life-ring"></i> Usando respaldo ThingSpeak: ' + App.escapeHtml(App.localError || App.localBlockedReason() || 'Grafana no disponible') +
                '. Se reintentará la red local automáticamente · Última actualización: ' + hora;
        }
    }

    function fetchStation(stationId) {
        return App.fetchReading(stationId)
            .then(function(d) {
                lastSource[stationId] = d.source;
                renderCharts(stationId, d.source);

                document.getElementById('liveData' + stationId).innerHTML =
                    pzemItem(fmt(d.voltaje, 1), 'V', 'Voltaje') +
                    pzemItem(fmt(d.corriente, 3), 'A', 'Corriente') +
                    pzemItem(fmt(d.potencia, 1), 'W', 'Potencia') +
                    pzemItem(fmt(d.energia, 3), 'kWh', 'Energía') +
                    pzemItem(fmt(d.frecuencia, 1), 'Hz', 'Frecuencia') +
                    pzemItem(fmt(d.fp, 2), '', 'Factor P.');

                var ts = new Date(d.time);
                document.getElementById('lastUpdate' + stationId).textContent =
                    'Última lectura: ' + ts.toLocaleString('es-MX') + ' · ' + SOURCE_LABEL[d.source] +
                    (d.entryId !== null ? ' (Entry #' + d.entryId + ')' : '');

                var check = App.validateReading(stationId, d.time, d.entryId, d.source);
                var icons  = { ok: 'fa-check-circle', warning: 'fa-exclamation-triangle', error: 'fa-times-circle' };
                var colors = { ok: 'var(--green)', warning: 'var(--yellow)', error: 'var(--red)' };
                var checkEl = document.getElementById('tsCheck' + stationId);
                checkEl.style.color = colors[check.level];
                checkEl.innerHTML = '<i class="fas ' + icons[check.level] + '"></i> ' + check.message;

                // Con datos viejos no se puede afirmar que la estación esté cargando
                var badge = document.getElementById('live' + stationId);
                if (check.level !== 'ok') {
                    badge.className = 'badge badge-offline';
                    badge.textContent = 'Sin datos recientes';
                } else {
                    var cargando = (d.corriente || 0) > 0.5;
                    badge.className = cargando ? 'badge badge-charging' : 'badge badge-available';
                    badge.textContent = cargando ? 'Cargando' : 'Disponible';
                }
            })
            .catch(function(err) {
                console.error('Estación ' + stationId + ':', err);
                var badge = document.getElementById('live' + stationId);
                badge.className = 'badge badge-offline';
                badge.textContent = 'Error';
                document.getElementById('tsCheck' + stationId).textContent = 'Sin datos de Grafana ni de ThingSpeak';
            });
    }

    App.initUI('monitoreo').then(function(ready) {
    if (!ready) return;
        [1, 2, 3].forEach(function(id) {
            document.getElementById('tab-' + id).innerHTML = buildStationTab(id);
        });

        document.querySelectorAll('.tab').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(function(b) { b.classList.remove('active'); });
                document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
                btn.classList.add('active');
                document.getElementById('tab-' + btn.getAttribute('data-tab')).classList.add('active');
            });
        });

        // Red local: cada 10 s. Con el respaldo de ThingSpeak: cada 30 s (su límite es ~15 s).
        function fetchAll() {
            Promise.all([1, 2, 3].map(fetchStation)).then(function() {
                renderSourceStatus();
                var allLocal = [1, 2, 3].every(function(id) { return lastSource[id] === 'grafana'; });
                setTimeout(fetchAll, allLocal ? 10000 : 30000);
            });
        }

        function showClockStatus() {
            var el = document.getElementById('clockStatus');
            var skew = Math.abs(App.clockOffset);
            el.className = skew > App.TIME_RULES.maxClockSkew ? 'alert alert-warning' : 'alert alert-success';
            el.innerHTML = '<i class="fas fa-clock"></i> Reloj sincronizado con el servidor · desfase del equipo: ' +
                (App.clockOffset >= 0 ? '-' : '+') + (skew / 1000).toFixed(2) + ' s' +
                (skew > App.TIME_RULES.maxClockSkew ? ' (la hora de este equipo está desajustada; se usa la hora del servidor)' : '');
        }

        App.syncServerClock()
            .then(showClockStatus)
            .catch(function(err) {
                console.error('Error al sincronizar reloj:', err);
                var el = document.getElementById('clockStatus');
                el.className = 'alert alert-warning';
                el.innerHTML = '<i class="fas fa-clock"></i> No se pudo sincronizar con el servidor; se usa la hora local del equipo.';
            })
            .then(fetchAll);
    });
    </script>
</body>
</html>
